<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Baggage Drop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(to bottom, #0080ff, #004080);
        }
        
        .bag-animation {
            transition: all 0.5s ease-in-out;
        }
        
        .bag-open {
            transform: scale(1.2);
        }
        
        .bag-close {
            transform: scale(0.8);
        }
        
        .zoom-out {
            transform: scale(0.3);
            transition: all 2s ease-in-out;
        }
        
        .ant-walk {
            animation: walk 3s ease-in-out forwards;
        }
        
        @keyframes walk {
            0% { transform: translateX(0) scale(0.3); }
            50% { transform: translateX(-100px) scale(0.3); }
            100% { transform: translateX(-300px) scale(0.1); opacity: 0; }
        }
        
        .item-fall {
            animation: fallIntoBag 1s ease-in forwards;
        }
        
        @keyframes fallIntoBag {
            0% { transform: translateY(-50px) scale(1); opacity: 1; }
            100% { transform: translateY(100px) scale(0.3); opacity: 0; }
        }
        
        .windows-xp-window {
            background: #c0c0c0;
            border: 2px outset #c0c0c0;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .windows-xp-titlebar {
            background: linear-gradient(to bottom, #0080ff, #004080);
            color: white;
            padding: 4px 8px;
            border-bottom: 1px solid #004080;
            font-weight: bold;
            font-size: 11px;
        }
        
        .windows-xp-button {
            background: linear-gradient(to bottom, #f0f0f0, #d0d0d0);
            border: 1px outset #c0c0c0;
            padding: 2px 8px;
            font-family: 'Tahoma', 'Arial', sans-serif;
            font-size: 11px;
            cursor: pointer;
        }
        
        .windows-xp-button:hover {
            background: linear-gradient(to bottom, #f8f8f8, #e0e0e0);
        }
        
        .windows-xp-button:active {
            background: linear-gradient(to bottom, #d0d0d0, #f0f0f0);
            border: 1px inset #c0c0c0;
        }
        
        .windows-xp-input {
            background: white;
            border: 1px inset #c0c0c0;
            padding: 2px 4px;
            font-family: 'Tahoma', 'Arial', sans-serif;
            font-size: 11px;
        }
        
        .windows-xp-textarea {
            background: white;
            border: 1px inset #c0c0c0;
            padding: 2px 4px;
            font-family: 'Tahoma', 'Arial', sans-serif;
            font-size: 11px;
            resize: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-4xl">
        
        <!-- Windows XP Title Bar -->
        <div class="windows-xp-titlebar flex items-center justify-between">
            <div class="flex items-center space-x-1">
                <div class="w-3 h-3 bg-yellow-400 border border-yellow-500 rounded-sm"></div>
                <div class="w-3 h-3 bg-green-400 border border-green-500 rounded-sm"></div>
                <div class="w-3 h-3 bg-red-400 border border-red-500 rounded-sm"></div>
            </div>
            <span>Digital Baggage Drop</span>
            <div class="w-3 h-3"></div>
        </div>
        
        <!-- Main Window -->
        <div class="windows-xp-window">
            <!-- Main Bag View -->
            <div id="mainView" class="p-6 text-center">
                <div class="mb-8">
                    <img id="bagImage" src="bag.jpg" alt="Closed Bag" class="mx-auto w-64 h-64 object-contain bag-animation">
                </div>
                <h2 class="text-2xl font-bold text-black mb-4">
                    Digital Baggage Drop
                </h2>
                <p class="text-gray-700 mb-8 max-w-md mx-auto">
                    Click to open the bag and drop your worries
                </p>
                <button onclick="openBag()" class="windows-xp-button text-lg py-2 px-6">
                    Open Bag
                </button>
            </div>

            <!-- Drop Interface -->
            <div id="dropView" style="display: none;" class="p-6 text-center">
                <div class="mb-8">
                    <img id="bagImage2" src="bag.jpg" alt="Open Bag" class="mx-auto w-64 h-64 object-contain bag-animation bag-open">
                </div>
                <h2 class="text-2xl font-bold text-black mb-4">
                    Drop Your Worries
                </h2>
                
                <!-- Text Input -->
                <div class="mb-4">
                    <input type="text" id="textInput" placeholder="Type something..." class="windows-xp-input mb-2 w-64">
                    <br>
                    <button onclick="addTextItem()" class="windows-xp-button">
                        Add Text
                    </button>
                </div>
                
                <!-- Image Upload -->
                <div class="mb-4">
                    <input type="file" id="imageInput" accept="image/*" class="mb-2">
                    <br>
                    <button onclick="addImageItem()" class="windows-xp-button">
                        Add Image
                    </button>
                </div>
                
                <!-- Items List -->
                <div id="itemsList" class="mb-6">
                    <h3 class="text-black mb-2">Items in bag:</h3>
                    <div id="itemsContainer" class="space-y-2"></div>
                </div>
                
                <button onclick="closeBag()" class="windows-xp-button text-lg py-2 px-6">
                    Close Bag & Send Away
                </button>
            </div>

            <!-- Ant Sequence -->
            <div id="antView" style="display: none;" class="p-6 text-center">
                <div class="mb-8">
                    <img id="antImage" src="sad-ant-with-bindle.jpg" alt="Ant with bag" class="mx-auto w-80 h-64 object-contain">
                </div>
                <h2 class="text-2xl font-bold text-black mb-4">
                    Your worries are being carried away
                </h2>
                <p class="text-gray-700 mb-8">
                    The ant is taking your baggage into the sunset
                </p>
                <button onclick="startOver()" class="windows-xp-button text-lg py-2 px-6">
                    Start Over
                </button>
            </div>
        </div>
        
    </div>

    <script>
        let currentBagState = 1; // 1 = closed, 2 = open, 3 = closing
        let baggageItems = [];
        
        function openBag() {
            // Hide main view, show drop view
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('dropView').style.display = 'block';
            
            // Animate bag opening
            setTimeout(() => {
                document.getElementById('bagImage2').src = 'bag2.png'; // Assuming you have bag2.png
            }, 200);
            
            setTimeout(() => {
                document.getElementById('bagImage2').src = 'bag3.png'; // Assuming you have bag3.png
            }, 400);
        }
        
        function addTextItem() {
            const input = document.getElementById('textInput');
            if (input.value.trim()) {
                const item = {
                    type: 'text',
                    content: input.value,
                    id: Date.now()
                };
                baggageItems.push(item);
                input.value = '';
                updateItemsList();
                animateItemIntoBag(item);
            }
        }
        
        function addImageItem() {
            const input = document.getElementById('imageInput');
            if (input.files[0]) {
                const item = {
                    type: 'image',
                    content: input.files[0].name,
                    id: Date.now()
                };
                baggageItems.push(item);
                input.value = '';
                updateItemsList();
                animateItemIntoBag(item);
            }
        }
        
        function animateItemIntoBag(item) {
            // Create a temporary element to animate falling into bag
            const tempItem = document.createElement('div');
            tempItem.textContent = item.content;
            tempItem.className = 'absolute text-white bg-blue-500 px-2 py-1 rounded item-fall';
            tempItem.style.left = '50%';
            tempItem.style.top = '20%';
            tempItem.style.transform = 'translateX(-50%)';
            
            document.body.appendChild(tempItem);
            
            // Remove after animation
            setTimeout(() => {
                document.body.removeChild(tempItem);
            }, 1000);
        }
        
        function updateItemsList() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = baggageItems.map(item => 
                `<div class="text-white text-sm">${item.type === 'text' ? '📝' : '📷'} ${item.content}</div>`
            ).join('');
        }
        
        function closeBag() {
            // Animate bag closing
            document.getElementById('bagImage2').classList.add('bag-close');
            
            setTimeout(() => {
                // Hide drop view, show ant view
                document.getElementById('dropView').style.display = 'none';
                document.getElementById('antView').style.display = 'block';
                
                // Start zoom out animation
                setTimeout(() => {
                    document.getElementById('antImage').classList.add('zoom-out');
                }, 500);
                
                // Start ant walking animation
                setTimeout(() => {
                    document.getElementById('antImage').classList.add('ant-walk');
                }, 2000);
                
            }, 1000);
        }
        
        function startOver() {
            // Reset everything
            document.getElementById('mainView').style.display = 'block';
            document.getElementById('dropView').style.display = 'none';
            document.getElementById('antView').style.display = 'none';
            
            // Reset bag image
            document.getElementById('bagImage2').src = 'bag.jpg';
            document.getElementById('bagImage2').classList.remove('bag-open', 'bag-close');
            document.getElementById('antImage').classList.remove('zoom-out', 'ant-walk');
            
            // Clear items
            baggageItems = [];
            document.getElementById('itemsContainer').innerHTML = '';
        }
    </script>
</body>
</html>
