<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Most Useless App Ever Created</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57);
            background-size: 400% 400%;
            animation: gradientShift 3s ease infinite;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-size: 2.5em;
            margin-bottom: 30px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .useless-button {
            background: linear-gradient(45deg, #ff4757, #ff3838);
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .useless-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .useless-button:active {
            transform: scale(0.95);
        }

        .counter {
            font-size: 3em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin: 20px 0;
        }

        .useless-input {
            padding: 15px;
            font-size: 16px;
            border: 3px dashed #fff;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 300px;
            margin: 10px;
            text-align: center;
        }

        .useless-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 30px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            border-radius: 10px;
            transition: width 0.3s ease;
            animation: progressShake 1s infinite;
        }

        @keyframes progressShake {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }

        .color-display {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 20px auto;
            border: 5px solid #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .runaway-button {
            position: relative;
            background: linear-gradient(45deg, #ff9ff3, #f368e0);
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.1s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .message {
            color: #fff;
            font-size: 1.2em;
            margin: 20px 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            min-height: 30px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .feature-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤪 The Most Useless App Ever 🤪</h1>
        
        <div class="feature-grid">
            <div class="feature-box">
                <h3>Button That Does Nothing</h3>
                <button class="useless-button" onclick="doAbsolutelyNothing()">
                    Click Me! (I Promise Nothing Will Happen)
                </button>
                <div class="message" id="nothingMessage"></div>
            </div>

            <div class="feature-box">
                <h3>Backwards Counter</h3>
                <div class="counter" id="backwardsCounter">0</div>
                <button class="useless-button" onclick="countBackwards()">
                    Count Backwards (It's Useless!)
                </button>
            </div>

            <div class="feature-box">
                <h3>Self-Destructing Text</h3>
                <input type="text" class="useless-input" id="selfDestructInput" 
                       placeholder="Type something... it will disappear!" 
                       oninput="deleteText()">
                <div class="message">Watch your text vanish as you type!</div>
            </div>

            <div class="feature-box">
                <h3>Runaway Button</h3>
                <button class="runaway-button" id="runawayBtn" onmouseover="runAway()">
                    Try to Click Me!
                </button>
                <div class="message">This button is too shy to be clicked!</div>
            </div>

            <div class="feature-box">
                <h3>Reverse Progress Bar</h3>
                <div class="progress-container">
                    <div class="progress-bar" id="reverseProgress" style="width: 100%"></div>
                </div>
                <button class="useless-button" onclick="reverseProgress()">
                    Make Progress Go Backwards
                </button>
            </div>

            <div class="feature-box">
                <h3>Gray Color Generator</h3>
                <div class="color-display" id="colorDisplay" style="background: gray;"></div>
                <button class="useless-button" onclick="generateGray()">
                    Generate Random Color (Always Gray)
                </button>
                <div class="message" id="colorMessage">It's always gray. Always.</div>
            </div>
        </div>

        <div style="margin-top: 30px;">
            <button class="useless-button" onclick="showUselessMessage()">
                🎉 Celebrate Uselessness! 🎉
            </button>
        </div>
    </div>

    <script>
        let backwardsCount = 0;
        let progressValue = 100;
        let clickCount = 0;

        function doAbsolutelyNothing() {
            clickCount++;
            const messages = [
                "I told you nothing would happen!",
                "Still nothing! Surprised?",
                "Absolutely nothing! Again!",
                "Nothing. Nada. Zilch.",
                "You're still clicking? Nothing!",
                "This button is professionally useless!",
                "Nothing happened. Again.",
                "I'm really good at doing nothing!",
                "Nothing! Nothing! Nothing!",
                "You've clicked " + clickCount + " times for nothing!"
            ];
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            document.getElementById('nothingMessage').textContent = randomMessage;
            
            // Add some useless animation
            const button = event.target;
            button.style.transform = 'rotate(360deg)';
            setTimeout(() => {
                button.style.transform = 'rotate(0deg)';
            }, 500);
        }

        function countBackwards() {
            backwardsCount--;
            document.getElementById('backwardsCounter').textContent = backwardsCount;
            
            // Add some useless effects
            const counter = document.getElementById('backwardsCounter');
            counter.style.color = `hsl(${Math.abs(backwardsCount) * 10}, 70%, 60%)`;
            counter.style.transform = 'scale(1.2)';
            setTimeout(() => {
                counter.style.transform = 'scale(1)';
            }, 200);
        }

        function deleteText() {
            const input = document.getElementById('selfDestructInput');
            setTimeout(() => {
                input.value = '';
            }, 100);
        }

        function runAway() {
            const button = document.getElementById('runawayBtn');
            const container = button.parentElement;
            const containerRect = container.getBoundingClientRect();
            
            const randomX = Math.random() * (containerRect.width - 200);
            const randomY = Math.random() * (containerRect.height - 100);
            
            button.style.position = 'absolute';
            button.style.left = randomX + 'px';
            button.style.top = randomY + 'px';
            button.style.transform = 'scale(0.8)';
            
            setTimeout(() => {
                button.style.transform = 'scale(1)';
            }, 200);
        }

        function reverseProgress() {
            progressValue -= 10;
            if (progressValue < 0) progressValue = 100;
            
            document.getElementById('reverseProgress').style.width = progressValue + '%';
            
            // Add useless color change
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.getElementById('reverseProgress').style.background = randomColor;
        }

        function generateGray() {
            const shades = ['#808080', '#696969', '#A9A9A9', '#C0C0C0', '#D3D3D3', '#DCDCDC'];
            const randomGray = shades[Math.floor(Math.random() * shades.length)];
            
            document.getElementById('colorDisplay').style.background = randomGray;
            
            const messages = [
                "It's gray. Again.",
                "Surprise! It's gray!",
                "Still gray. What did you expect?",
                "Gray. Always gray.",
                "Another shade of gray!",
                "Gray. Just gray.",
                "It's gray. I'm not lying.",
                "Gray. Forever gray.",
                "Still gray. Still useless.",
                "Gray. The color of disappointment."
            ];
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            document.getElementById('colorMessage').textContent = randomMessage;
        }

        function showUselessMessage() {
            const messages = [
                "🎉 Congratulations! You've successfully used the most useless app ever created! 🎉",
                "🏆 You win the award for wasting time most effectively! 🏆",
                "🎊 This app serves absolutely no purpose, and you love it! 🎊",
                "🌟 You've achieved peak uselessness! 🌟",
                "🎈 Nothing productive was accomplished today! 🎈",
                "🎪 Welcome to the circus of pointlessness! 🎪",
                "🎭 You've mastered the art of doing nothing! 🎭",
                "🎨 This app is a masterpiece of uselessness! 🎨",
                "🎵 The symphony of pointlessness plays on! 🎵",
                "🎯 You've hit the bullseye of uselessness! 🎯"
            ];
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            alert(randomMessage);
            
            // Add some useless confetti effect
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.top = '-10px';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.background = `hsl(${Math.random() * 360}, 70%, 60%)`;
                    confetti.style.borderRadius = '50%';
                    confetti.style.pointerEvents = 'none';
                    confetti.style.zIndex = '1000';
                    confetti.style.animation = 'fall 3s linear forwards';
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 3000);
                }, i * 50);
            }
        }

        // Add CSS for confetti animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                to {
                    transform: translateY(100vh) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Make the runaway button reset position when clicked
        document.getElementById('runawayBtn').addEventListener('click', function() {
            this.style.position = 'static';
            this.style.left = 'auto';
            this.style.top = 'auto';
            alert("You caught me! But I'm still useless!");
        });

        // Add some useless background effects
        setInterval(() => {
            const body = document.body;
            const currentBg = body.style.background;
            body.style.background = currentBg === 'linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57)' 
                ? 'linear-gradient(45deg, #feca57, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4)' 
                : 'linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57)';
        }, 5000);

        // Add useless sound effects (visual feedback since we can't play audio)
        function addUselessEffect(element) {
            element.style.boxShadow = '0 0 20px rgba(255, 255, 255, 0.8)';
            setTimeout(() => {
                element.style.boxShadow = '0 4px 15px rgba(0, 0, 0, 0.2)';
            }, 300);
        }

        // Make all buttons have useless effects
        document.querySelectorAll('.useless-button').forEach(button => {
            button.addEventListener('click', () => addUselessEffect(button));
        });
    </script>
</body>
</html>
